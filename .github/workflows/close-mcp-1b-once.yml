name: Fechar MCP Fatia 1B uma vez

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  fechar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: agent/mcp-fatia-1b-visual
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Aplicar provas e fechamento
        run: python .github/mcp-1b-close/apply.py

      - name: Remover infraestrutura temporária
        run: rm -rf .github/mcp-1b-close .github/workflows/close-mcp-1b-once.yml

      - name: Atualizar índices gerados
        run: |
          npm run mapa
          npm run docs:toc

      - name: Validar código e documentação
        run: |
          npm run typecheck
          npm test
          npm run mcp:check
          npm run build
          npm run mapa:check
          npm run docs:toc:check
          npm run docs:links:check
          npm run planos:check
          git diff --check

      - name: Publicar fechamento na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Encerra Fatia 1B visual do MCP"
          git push origin HEAD:agent/mcp-fatia-1b-visual
